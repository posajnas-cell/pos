openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BillFlow POS business operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: workspace
    description: Business workspace and shop management
  - name: catalog
    description: Product and category management
  - name: sales
    description: POS checkout and sales history
  - name: expenses
    description: Business expense tracking
  - name: analytics
    description: Dashboard and reports
  - name: employees
    description: Employee and shift management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: Get the signed-in owner's workspace
      responses:
        "200":
          description: Workspace and authorized shops
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
  /shops:
    get:
      operationId: listShops
      tags: [workspace]
      summary: List authorized shops
      responses:
        "200":
          description: Shop list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shop"
    post:
      operationId: createShop
      tags: [workspace]
      summary: Create a shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopInput"
      responses:
        "201":
          description: Created shop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
  /shops/{shopId}:
    patch:
      operationId: updateShop
      tags: [workspace]
      summary: Update a shop
      parameters:
        - name: shopId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopUpdate"
      responses:
        "200":
          description: Updated shop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List shop product categories
      parameters:
        - name: shopId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [catalog]
      summary: Create a product category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /categories/{categoryId}:
    patch:
      operationId: updateCategory
      tags: [catalog]
      summary: Update a product category
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: Search products in a shop
      parameters:
        - name: shopId
          in: query
          required: true
          schema: { type: integer }
        - name: categoryId
          in: query
          required: false
          schema: { type: integer }
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [catalog]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{productId}:
    patch:
      operationId: updateProduct
      tags: [catalog]
      summary: Update a product
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees assigned to a shop
      parameters:
        - name: shopId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Add an employee record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: Search completed bills
      parameters:
        - name: shopId
          in: query
          required: false
          schema: { type: integer }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
        - name: employeeId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: completeSale
      tags: [sales]
      summary: Atomically complete a POS bill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Completed sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: Search shop expenses
      parameters:
        - name: shopId
          in: query
          required: false
          schema: { type: integer }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Record a multi-item expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [analytics]
      summary: Get data-backed dashboard metrics
      parameters:
        - name: shopId
          in: query
          required: false
          schema: { type: integer }
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month]
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /reports/sales:
    get:
      operationId: getSalesReport
      tags: [analytics]
      summary: Aggregate sales by employee and payment method
      parameters:
        - name: shopId
          in: query
          required: false
          schema: { type: integer }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Sales report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReport"
  /reports/expenses:
    get:
      operationId: getExpensesReport
      tags: [analytics]
      summary: Aggregate expenses by category
      parameters:
        - name: shopId
          in: query
          required: false
          schema: { type: integer }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Expense report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpensesReport"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Shop:
      type: object
      required: [id, name, address, phone, currency, taxRateBps, isActive]
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        currency: { type: string }
        taxRateBps: { type: integer }
        isActive: { type: boolean }
    ShopInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        address: { type: string }
        phone: { type: string }
        currency: { type: string, default: INR }
        taxRateBps: { type: integer, minimum: 0, maximum: 10000 }
    ShopUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        address: { type: string }
        phone: { type: string }
        currency: { type: string }
        taxRateBps: { type: integer, minimum: 0, maximum: 10000 }
        isActive: { type: boolean }
    Workspace:
      type: object
      required: [businessName, role, userName, shops]
      properties:
        businessName: { type: string }
        role: { type: string, enum: [owner, manager, cashier] }
        userName: { type: string }
        shops:
          type: array
          items: { $ref: "#/components/schemas/Shop" }
    Category:
      type: object
      required: [id, shopId, name, color, sortOrder, isActive]
      properties:
        id: { type: integer }
        shopId: { type: integer }
        name: { type: string }
        color: { type: string }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    CategoryInput:
      type: object
      required: [shopId, name]
      properties:
        shopId: { type: integer }
        name: { type: string, minLength: 1 }
        color: { type: string }
        sortOrder: { type: integer }
    CategoryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        color: { type: string }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    Product:
      type: object
      required: [id, shopId, categoryId, name, description, priceCents, sku, imageUrl, isAvailable, parcelType, parcelValue]
      properties:
        id: { type: integer }
        shopId: { type: integer }
        categoryId: { type: ["integer", "null"] }
        name: { type: string }
        description: { type: ["string", "null"] }
        priceCents: { type: integer }
        sku: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        isAvailable: { type: boolean }
        parcelType: { type: string, enum: [none, fixed, percent] }
        parcelValue: { type: integer }
    ProductInput:
      type: object
      required: [shopId, name, priceCents]
      properties:
        shopId: { type: integer }
        categoryId: { type: ["integer", "null"] }
        name: { type: string, minLength: 1 }
        description: { type: string }
        priceCents: { type: integer, minimum: 0 }
        sku: { type: string }
        imageUrl: { type: string }
        isAvailable: { type: boolean }
        parcelType: { type: string, enum: [none, fixed, percent] }
        parcelValue: { type: integer, minimum: 0 }
    ProductUpdate:
      type: object
      properties:
        categoryId: { type: ["integer", "null"] }
        name: { type: string, minLength: 1 }
        description: { type: string }
        priceCents: { type: integer, minimum: 0 }
        sku: { type: string }
        imageUrl: { type: string }
        isAvailable: { type: boolean }
        parcelType: { type: string, enum: [none, fixed, percent] }
        parcelValue: { type: integer, minimum: 0 }
    Employee:
      type: object
      required: [id, shopId, name, role, isActive]
      properties:
        id: { type: integer }
        shopId: { type: integer }
        name: { type: string }
        role: { type: string, enum: [owner, manager, cashier] }
        isActive: { type: boolean }
    EmployeeInput:
      type: object
      required: [shopId, name, role]
      properties:
        shopId: { type: integer }
        name: { type: string, minLength: 1 }
        role: { type: string, enum: [manager, cashier] }
    SaleLineInput:
      type: object
      required: [productId, quantity, discountCents]
      properties:
        productId: { type: integer }
        quantity: { type: integer, minimum: 1 }
        discountCents: { type: integer, minimum: 0 }
    SaleItem:
      type: object
      required: [id, productName, quantity, unitPriceCents, discountCents, parcelCents, lineTotalCents]
      properties:
        id: { type: integer }
        productName: { type: string }
        quantity: { type: integer }
        unitPriceCents: { type: integer }
        discountCents: { type: integer }
        parcelCents: { type: integer }
        lineTotalCents: { type: integer }
    SaleInput:
      type: object
      required: [shopId, idempotencyKey, orderType, paymentMethod, discountCents, items]
      properties:
        shopId: { type: integer }
        idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
        orderType: { type: string, enum: [dine-in, takeaway] }
        paymentMethod: { type: string, enum: [cash, upi, card, other] }
        discountCents: { type: integer, minimum: 0 }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SaleLineInput" }
    Sale:
      type: object
      required: [id, shopId, employeeId, employeeName, billNumber, orderType, paymentMethod, subtotalCents, discountCents, taxCents, parcelCents, totalCents, createdAt, items]
      properties:
        id: { type: integer }
        shopId: { type: integer }
        employeeId: { type: integer }
        employeeName: { type: string }
        billNumber: { type: string }
        orderType: { type: string, enum: [dine-in, takeaway] }
        paymentMethod: { type: string, enum: [cash, upi, card, other] }
        subtotalCents: { type: integer }
        discountCents: { type: integer }
        taxCents: { type: integer }
        parcelCents: { type: integer }
        totalCents: { type: integer }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/SaleItem" }
    ExpenseLineInput:
      type: object
      required: [categoryName, productName, quantity, unit, unitPriceCents]
      properties:
        categoryName: { type: string }
        productName: { type: string, minLength: 1 }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, minLength: 1 }
        unitPriceCents: { type: integer, minimum: 0 }
    ExpenseInput:
      type: object
      required: [shopId, expenseDate, paymentMethod, items]
      properties:
        shopId: { type: integer }
        expenseDate: { type: string, format: date }
        supplier: { type: string }
        invoiceReference: { type: string }
        paymentMethod: { type: string, enum: [cash, upi, card, other] }
        note: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ExpenseLineInput" }
    ExpenseItem:
      type: object
      required: [id, categoryName, productName, quantity, unit, unitPriceCents, lineTotalCents]
      properties:
        id: { type: integer }
        categoryName: { type: string }
        productName: { type: string }
        quantity: { type: number }
        unit: { type: string }
        unitPriceCents: { type: integer }
        lineTotalCents: { type: integer }
    Expense:
      type: object
      required: [id, shopId, employeeName, expenseDate, supplier, invoiceReference, paymentMethod, note, totalCents, createdAt, items]
      properties:
        id: { type: integer }
        shopId: { type: integer }
        employeeName: { type: string }
        expenseDate: { type: string, format: date }
        supplier: { type: ["string", "null"] }
        invoiceReference: { type: ["string", "null"] }
        paymentMethod: { type: string, enum: [cash, upi, card, other] }
        note: { type: ["string", "null"] }
        totalCents: { type: integer }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/ExpenseItem" }
    DailySalesPoint:
      type: object
      required: [date, totalCents]
      properties:
        date: { type: string, format: date }
        totalCents: { type: integer }
    PaymentTotal:
      type: object
      required: [method, totalCents]
      properties:
        method: { type: string }
        totalCents: { type: integer }
    DashboardSummary:
      type: object
      required: [salesCents, billCount, expensesCents, operatingBalanceCents, averageBillCents, salesByDay, payments, recentSales]
      properties:
        salesCents: { type: integer }
        billCount: { type: integer }
        expensesCents: { type: integer }
        operatingBalanceCents: { type: integer }
        averageBillCents: { type: integer }
        salesByDay:
          type: array
          items: { $ref: "#/components/schemas/DailySalesPoint" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/PaymentTotal" }
        recentSales:
          type: array
          items: { $ref: "#/components/schemas/Sale" }
    EmployeeSalesTotal:
      type: object
      required: [employeeName, billCount, totalCents]
      properties:
        employeeName: { type: string }
        billCount: { type: integer }
        totalCents: { type: integer }
    SalesReport:
      type: object
      required: [totalCents, billCount, parcelCents, discountCents, byEmployee, byPayment, sales]
      properties:
        totalCents: { type: integer }
        billCount: { type: integer }
        parcelCents: { type: integer }
        discountCents: { type: integer }
        byEmployee:
          type: array
          items: { $ref: "#/components/schemas/EmployeeSalesTotal" }
        byPayment:
          type: array
          items: { $ref: "#/components/schemas/PaymentTotal" }
        sales:
          type: array
          items: { $ref: "#/components/schemas/Sale" }
    ExpenseCategoryTotal:
      type: object
      required: [categoryName, totalCents]
      properties:
        categoryName: { type: string }
        totalCents: { type: integer }
    ExpensesReport:
      type: object
      required: [totalCents, byCategory, expenses]
      properties:
        totalCents: { type: integer }
        byCategory:
          type: array
          items: { $ref: "#/components/schemas/ExpenseCategoryTotal" }
        expenses:
          type: array
          items: { $ref: "#/components/schemas/Expense" }

